# Garage production — ทบทวนก่อนใช้จริง (architecture.md §8.5)
# ⚠️ replication_factor = 1 คือไม่มีสำเนา ถ้าดิสก์เสีย = เอกสารหายทั้งหมด
#    ต้องพึ่ง backup อย่างเดียว → พิจารณา 3 node ถ้ารับความเสี่ยงนี้ไม่ได้
# ⚠️ verify กับเอกสารของ Garage เวอร์ชันที่ pin จริงก่อน deploy
metadata_dir = "/var/lib/garage/meta"
data_dir     = "/var/lib/garage/data"
db_engine    = "lmdb"

replication_factor = 1

rpc_bind_addr   = "[::]:3901"
rpc_public_addr = "garage:3901"
rpc_secret_file = "/run/secrets/garage_rpc_secret"

[s3_api]
s3_region     = "garage"
api_bind_addr = "[::]:3900"
root_domain   = ".s3.garage"

[admin]
api_bind_addr    = "[::]:3903"
admin_token_file = "/run/secrets/garage_admin_token"
