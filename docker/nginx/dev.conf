# dev — แยก 3 ช่องทางด้วย **ชื่อโฮสต์** บนพอร์ต 443 มาตรฐาน
#   https://api.<ip>.nip.io     → container `api`     (แอปคนขับ)
#   https://staff.<ip>.nip.io   → container `portal`  (เจ้าหน้าที่)
#   https://dl.<ip>.nip.io      → static: manifest + APK  (ห้าม pin cert §11.5)
#   http://*                    → 301 ไป https
#   :8080  api    → container `api`     (แอปคนขับ)
#   :8081  staff  → container `portal`  (เจ้าหน้าที่)
#   :8082  dl     → static: manifest + APK  (ห้าม pin cert §11.5)

# 🔴 nginx resolve ชื่อ upstream ครั้งเดียวตอน start แล้ว cache IP ไว้ถาวร
#    พอ `docker compose up -d api portal` สร้าง container ใหม่ IP เปลี่ยน
#    nginx จะยังยิงไป IP เดิม ซึ่งอาจกลายเป็นของอีก service ไปแล้ว
#    → api เสิร์ฟ /staff และ portal เสิร์ฟ /api/v1 สลับกันโดยไม่มีอะไรฟ้อง
#      (เจอจริงตอนพัฒนา และเป็นบั๊กที่ทำให้การแยกใน ADR 0007 พังเงียบๆ)
#
#    ใช้ resolver ของ Docker + เก็บ upstream ไว้ในตัวแปร เพื่อบังคับให้
#    nginx resolve ใหม่ทุก request แทนที่จะ cache ตอน start
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_x_request_id $req_id {
    default   $http_x_request_id;
    ""        $request_id;
}

# มี scheme กับ port ด้วย เพราะ :8080 และ :8443 เสิร์ฟแอปตัวเดียวกัน
# เวลาไล่ปัญหาต้องแยกออกว่า request เข้ามาทางไหน และตอนทดสอบ pinning
# ต้องยืนยันได้ว่า "ไม่มี request มาถึงเลย" ไม่ใช่ "มาแต่ไม่เห็น"
log_format app escape=json
    '{"time":"$time_iso8601","req_id":"$req_id","host":"$host",'
    '"scheme":"$scheme","port":"$server_port",'
    # $request_uri คือของที่ client ขอมาจริง ส่วน $uri คือหลัง try_files rewrite
    # ซึ่งกลายเป็น /index.php ทุก request — ทำให้ access log แยก endpoint ไม่ออกเลย
    '"method":"$request_method","uri":"$request_uri","status":$status,'
    '"bytes":$body_bytes_sent,"rt":$request_time,"ua":"$http_user_agent"}';

access_log /dev/stdout app;
error_log  /dev/stderr warn;

# ── ชื่อโฮสต์ ────────────────────────────────────────────────
#
# สามช่องทางแยกกันด้วย **ชื่อ** ไม่ใช่เลขพอร์ต — พอร์ต 443 เดียวเสิร์ฟหลาย
# host ได้ก็ด้วย SNI เท่านั้น และนี่คือรูปแบบเดียวกับ prod
#
# ใช้ nip.io เพราะชื่อมี IP อยู่ในตัวและ resolve ผ่าน DNS สาธารณะ มือถือจึง
# ใช้ได้โดยไม่ต้องแก้ /etc/hosts ซึ่งบนเครื่องที่ไม่ root ทำไม่ได้
# ── :80 → เปลี่ยนเส้นทางไป https ทั้งหมด ─────────────────────
#
# ไม่เสิร์ฟอะไรเลยนอกจาก redirect ทั้ง API และหน้าเจ้าหน้าที่รับข้อมูลที่
# ไม่ควรวิ่งผ่าน cleartext แม้แต่ครั้งเดียวก่อนถูก redirect
server {
    listen 80 default_server;
    server_name _;

    return 301 https://$host$request_uri;
}

# ── api → container `api` ────────────────────────────────────
#
# default_server ของ :443 ด้วย เพื่อให้เรียกด้วยหมายเลข IP ตรงๆ ตอนไล่ปัญหา
# ยังเข้าถึง API ได้ (SNI ที่ไม่ตรงชื่อไหนเลยจะตกมาที่นี่)
#
# cert มาจาก bind mount ไม่ใช่ COPY ลง image: คีย์ที่อบเข้า layer จะอยู่ใน
# image history ถาวร ใครก็ `docker history` ดูได้ (CLAUDE.md §5)
server {
    listen 443 ssl default_server;
    http2 on;
    server_name api.192.168.10.53.nip.io;

    ssl_certificate     /etc/nginx/tls/api.crt;
    ssl_certificate_key /etc/nginx/tls/api.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    include /etc/nginx/snippets/api-app.conf;
}

# ── staff → container `portal` ───────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name staff.192.168.10.53.nip.io;

    ssl_certificate     /etc/nginx/tls/api.crt;
    ssl_certificate_key /etc/nginx/tls/api.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/html/public;
    index index.php;

    include /etc/nginx/conf.d/security-headers.conf;
    client_max_body_size 40M;

    # prod จำกัด IP หรือให้เข้าผ่าน VPN เท่านั้น (ADR 0007)
    # dev เปิดหมดเพื่อความสะดวก

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        set $upstream_portal portal:9000;
        fastcgi_pass $upstream_portal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_X_REQUEST_ID $req_id;
        # เขียนทับเสมอ ไม่ใช่ต่อท้าย — กัน client ปลอม IP (ดูเหตุผลใน server block ของ api)
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        # $host ตัด port ทิ้ง ทำให้ Laravel สร้าง URL เป็น http://192.168.10.53
        # (ไม่มี port) แล้ว asset ของ Filament โหลดไม่ขึ้น → หน้าเว็บไม่มี CSS/JS
        # และ Livewire ไม่ทำงาน ใช้ $server_port ไม่ใช่ port จาก Host header
        # เพราะ client ปลอม Host ได้ แต่ปลอม port ที่ nginx listen อยู่ไม่ได้
        fastcgi_param HTTP_X_FORWARDED_PORT $server_port;
        fastcgi_hide_header X-Powered-By;
        # ดาวน์โหลดเอกสารถอดรหัสแบบ stream — ใช้เวลานานกว่า request ปกติ (ADR 0005)
        fastcgi_read_timeout 300s;
        fastcgi_buffering off;
        internal;
    }

    location ~ \.php$ { return 404; }
    location ~ /\.    { deny all; }
}

# ── dl → manifest + APK (static) ─────────────────────────────
#
# คนละชื่อโฮสต์กับ api โดยตั้งใจ: นี่คือช่องทางกู้คืน **ห้าม pin certificate**
# ถ้า pin พังพร้อมกับ API แอปทั้งฐานจะแก้ไม่ได้เลย (§11.5)
# ความปลอดภัยมาจากลายเซ็นบน manifest ไม่ใช่ TLS (ADR 0006)
#
# dev ใช้ cert ใบเดียวกันเพราะเป็นเครื่องเดียว — prod ต้องแยกใบ เพื่อให้หมุน
# คีย์ของ API ได้โดยไม่แตะช่องทางนี้
server {
    listen 443 ssl;
    http2 on;
    server_name dl.192.168.10.53.nip.io;

    ssl_certificate     /etc/nginx/tls/api.crt;
    ssl_certificate_key /etc/nginx/tls/api.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /srv/dist;

    include /etc/nginx/conf.d/security-headers.conf;

    location = /app/v1/manifest.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=300" always;
    }

    location ~ ^/app/v1/.+\.apk$ {
        default_type application/vnd.android.package-archive;
        add_header Cache-Control "public, max-age=86400, immutable" always;
    }

    location / { return 404; }
}
