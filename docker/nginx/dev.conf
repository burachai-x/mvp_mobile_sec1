# dev — แยก 3 ช่องทางด้วย port (prod ใช้ server_name + TLS ดู prod.conf)
#   :8080  api    → container `api`     (แอปคนขับ)
#   :8081  staff  → container `portal`  (เจ้าหน้าที่)
#   :8082  dl     → static: manifest + APK  (ห้าม pin cert §11.5)

map $http_x_request_id $req_id {
    default   $http_x_request_id;
    ""        $request_id;
}

log_format app escape=json
    '{"time":"$time_iso8601","req_id":"$req_id","host":"$host",'
    '"method":"$request_method","uri":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"rt":$request_time,"ua":"$http_user_agent"}';

access_log /dev/stdout app;
error_log  /dev/stderr warn;

# ── api.example → container `api` ────────────────────────────
server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;

    include /etc/nginx/conf.d/security-headers.conf;

    # เอกสารสูงสุด 10 MB × 3 ไฟล์ (architecture.md §8.3)
    client_max_body_size 40M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass api:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_X_REQUEST_ID $req_id;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        internal;
    }

    # ห้ามให้ .php อื่นถูกเรียกตรง
    location ~ \.php$ { return 404; }
    location ~ /\.    { deny all; }
}

# ── staff.example → container `portal` ───────────────────────
server {
    listen 8081;
    server_name _;
    root /var/www/html/public;
    index index.php;

    include /etc/nginx/conf.d/security-headers.conf;
    client_max_body_size 40M;

    # prod จำกัด IP หรือให้เข้าผ่าน VPN เท่านั้น (ADR 0007)
    # dev เปิดหมดเพื่อความสะดวก

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass portal:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_X_REQUEST_ID $req_id;
        fastcgi_hide_header X-Powered-By;
        # ดาวน์โหลดเอกสารถอดรหัสแบบ stream — ใช้เวลานานกว่า request ปกติ (ADR 0005)
        fastcgi_read_timeout 300s;
        fastcgi_buffering off;
        internal;
    }

    location ~ \.php$ { return 404; }
    location ~ /\.    { deny all; }
}

# ── dl.example → manifest + APK (static) ─────────────────────
# แยก host โดยตั้งใจ: ช่องทางกู้คืน ห้าม pin certificate (§11.5)
# ความปลอดภัยมาจากลายเซ็นบน manifest ไม่ใช่ TLS (ADR 0006)
server {
    listen 8082;
    server_name _;
    root /srv/dist;

    include /etc/nginx/conf.d/security-headers.conf;

    location = /app/v1/manifest.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=300" always;
    }

    location ~ ^/app/v1/.+\.apk$ {
        default_type application/vnd.android.package-archive;
        add_header Cache-Control "public, max-age=86400, immutable" always;
    }

    location / { return 404; }
}
