# body ของ server block ฝั่ง api — ใช้ร่วมกันระหว่าง :8080 (plain) และ :8443 (TLS)
#
# แยกออกมาเพราะสอง listener ต้องเสิร์ฟ "ของเดียวกันเป๊ะ" ถ้า copy ไว้สองที่
# แล้วแก้ที่เดียว จะได้ API ที่พฤติกรรมต่างกันตาม port โดยไม่มีอะไรฟ้อง
#
# อยู่ใน snippets/ ไม่ใช่ conf.d/ เพราะ nginx.conf ทำ include conf.d/*.conf
# ที่ระดับ http แล้ว location จะใช้ตรงนั้นไม่ได้
root /var/www/html/public;
index index.php;

include /etc/nginx/conf.d/security-headers.conf;

# เอกสารสูงสุด 10 MB × 3 ไฟล์ (architecture.md §8.3)
client_max_body_size 40M;

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

location ~ ^/index\.php(/|$) {
    set $upstream_api api:9000;
    fastcgi_pass $upstream_api;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param HTTP_X_REQUEST_ID $req_id;
    # 🔴 ส่งต่อ IP ของ client จริง ไม่งั้น $request->ip() ใน Laravel จะเป็น IP
    #    ของ nginx ทุก request แล้ว rate limit ทั้งระบบกลายเป็น bucket เดียว
    #    ร่วมกันทุกคน — คนขับคนเดียวยิงจนเต็มโควตาจะทำให้ทั้ง fleet enroll ไม่ได้
    #
    #    ใช้ $remote_addr ไม่ใช่ $proxy_add_x_forwarded_for เพราะตัวหลัง
    #    **ต่อท้าย** ค่าที่ client ส่งมา ทำให้ client ปลอม X-Forwarded-For
    #    มาเองแล้ว Laravel เชื่อ → หมุน IP ปลอมเลี่ยง rate limit ได้ไม่จำกัด
    #    (ทดสอบแล้วเกิดขึ้นจริง) nginx เป็น edge ชั้นนอกสุดอยู่แล้ว
    #    จึงต้องเขียนทับค่าที่ client ส่งมาเสมอ
    #    ถ้าอนาคตมี CDN/LB อยู่หน้า nginx ต้องทบทวนข้อนี้ใหม่
    fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
    fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
    fastcgi_param HTTP_X_FORWARDED_HOST $host;
    # $host ตัด port ทิ้ง ทำให้ Laravel สร้าง URL ที่ไม่มี port
    # (ไม่มี port) แล้ว asset ของ Filament โหลดไม่ขึ้น → หน้าเว็บไม่มี CSS/JS
    # และ Livewire ไม่ทำงาน ใช้ $server_port ไม่ใช่ port จาก Host header
    # เพราะ client ปลอม Host ได้ แต่ปลอม port ที่ nginx listen อยู่ไม่ได้
    fastcgi_param HTTP_X_FORWARDED_PORT $server_port;
    fastcgi_hide_header X-Powered-By;
    fastcgi_read_timeout 60s;
    internal;
}

# ห้ามให้ .php อื่นถูกเรียกตรง
location ~ \.php$ { return 404; }
location ~ /\.    { deny all; }
