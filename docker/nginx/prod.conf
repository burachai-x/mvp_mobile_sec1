# prod — 3 ช่องทางแยกด้วยชื่อโฮสต์บน 443, :80 redirect ไป https
#
# ไฟล์นี้เป็น **template** — nginx entrypoint แทนค่า ${...} จาก env ตอน container
# start (20-envsubst-on-templates.sh) โดเมนจริงต่างกันทุก deployment จึง hardcode
# ไม่ได้ ตัวแปรที่ต้องตั้ง:
#   API_HOST     เช่น api.example.com
#   STAFF_HOST   เช่น staff.example.com
#   DL_HOST      เช่น dl.example.com
# ตัวแปรของ nginx เอง ($host $uri ฯลฯ) ไม่ถูกแตะ เพราะ entrypoint แทนเฉพาะ
# ตัวที่มีใน env จริง
#
# 🔴 cert: mount ตอน runtime ห้ามอบเข้า image (private key ใน layer อยู่ถาวร
#    ใครก็ `docker history`/`docker save` ดูได้ — CLAUDE.md §5)
#   /etc/nginx/tls/system.{crt,key}   api + staff (ฝั่งระบบ)
#   /etc/nginx/tls/dl.{crt,key}       ช่องอัปเดต — **คนละใบกับ system**
#
# 🔴 ทำไม dl ต้องแยกใบ (§11.5): ช่องอัปเดตคือช่องทางกู้คืน ถ้าใช้ใบเดียวกับ API
#    การหมุนคีย์ของ API จะไปแตะช่องนี้ด้วย และถ้า pin ฝั่ง API พังพร้อมกับ TLS
#    ของ dl แอปทั้งฐานจะแก้ไม่ได้เลย แยกใบ = หมุนคีย์ API ได้โดยไม่กระทบการกู้คืน

resolver 127.0.0.11 valid=10s ipv6=off;

map $http_x_request_id $req_id {
    default   $http_x_request_id;
    ""        $request_id;
}

log_format app escape=json
    '{"time":"$time_iso8601","req_id":"$req_id","host":"$host",'
    '"scheme":"$scheme","method":"$request_method","uri":"$request_uri",'
    '"status":$status,"bytes":$body_bytes_sent,"rt":$request_time}';

access_log /dev/stdout app;
error_log  /dev/stderr warn;

# ── ค่า TLS ที่ทุก server block ฝั่ง 443 ใช้ร่วมกัน ──────────────
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;
ssl_session_cache   shared:TLS:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# ── :80 → redirect ไป https ทั้งหมด ─────────────────────────
#
# ไม่เสิร์ฟอะไรนอกจาก redirect — ทั้ง API และหน้าเจ้าหน้าที่รับข้อมูลที่ไม่ควร
# วิ่งผ่าน cleartext แม้แต่ครั้งเดียวก่อนถูก redirect
server {
    listen 80 default_server;
    server_name _;

    return 301 https://$host$request_uri;
}

# ── api → container `api` ────────────────────────────────────
#
# default_server ของ 443 ด้วย: request ที่ SNI ไม่ตรงชื่อไหน (เช่น scan ด้วย IP)
# ตกมาที่นี่แทนที่จะหลุดไปเจอ portal
server {
    listen 443 ssl default_server;
    http2 on;
    server_name ${API_HOST};

    ssl_certificate     /etc/nginx/tls/system.crt;
    ssl_certificate_key /etc/nginx/tls/system.key;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    include /etc/nginx/snippets/api-app.conf;
}

# ── staff → container `portal` (จำกัดการเข้าถึง) ─────────────
server {
    listen 443 ssl;
    http2 on;
    server_name ${STAFF_HOST};

    ssl_certificate     /etc/nginx/tls/system.crt;
    ssl_certificate_key /etc/nginx/tls/system.key;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # หน้าเจ้าหน้าที่ต้องอยู่หลัง VPN หรือ IP allowlist (ADR 0007)
    # ops วางไฟล์ allow/deny ไว้ใน dir นี้ — glob ที่ว่างเปล่า nginx ยอมรับได้
    # ค่าเริ่มต้นเมื่อไม่มีไฟล์ = deny ทั้งหมด กันเผลอเปิด portal สู่อินเทอร์เน็ต
    include /etc/nginx/staff-acl/*.conf;
    deny all;

    root /var/www/html/public;
    index index.php;

    include /etc/nginx/conf.d/security-headers.conf;
    client_max_body_size 40M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        set $upstream_portal portal:9000;
        fastcgi_pass $upstream_portal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_X_REQUEST_ID $req_id;
        # เขียนทับเสมอ ไม่ใช่ต่อท้าย — กัน client ปลอม X-Forwarded-For
        # (เหตุผลเต็มใน api-app.conf) nginx เป็น edge ชั้นนอกสุด
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PORT $server_port;
        fastcgi_hide_header X-Powered-By;
        # ดาวน์โหลดเอกสารถอดรหัสแบบ stream ใช้เวลานานกว่า request ปกติ (ADR 0005)
        fastcgi_read_timeout 300s;
        fastcgi_buffering off;
        internal;
    }

    location ~ \.php$ { return 404; }
    location ~ /\.    { deny all; }
}

# ── dl → manifest + APK (static) ─────────────────────────────
#
# คนละชื่อโฮสต์ **และคนละ cert** กับ api โดยเจตนา (§11.5) — ห้าม pin ช่องนี้
# ความปลอดภัยของการอัปเดตมาจากลายเซ็นบน manifest ไม่ใช่ TLS (ADR 0006)
server {
    listen 443 ssl;
    http2 on;
    server_name ${DL_HOST};

    ssl_certificate     /etc/nginx/tls/dl.crt;
    ssl_certificate_key /etc/nginx/tls/dl.key;

    # ไม่ใส่ HSTS ที่นี่: ถ้าวันหนึ่งต้อง fallback ไป cleartext เพื่อกู้ระบบ
    # HSTS ที่เครื่องจำไว้จะขวาง — ช่องกู้คืนต้องไม่ผูกมัดตัวเอง

    root /srv/dist;

    include /etc/nginx/conf.d/security-headers.conf;

    location = /app/v1/manifest.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=300" always;
    }

    location ~ ^/app/v1/.+\.apk$ {
        default_type application/vnd.android.package-archive;
        add_header Cache-Control "public, max-age=86400, immutable" always;
    }

    location / { return 404; }
}
