; ตั้งค่า PHP ของแอป — ไฟล์นี้โหลดหลัง php.ini-production
memory_limit = 256M
max_execution_time = 60

; เอกสารจำกัด 10 MB ต่อไฟล์ (architecture.md §8.3)
; เผื่อ overhead ของ multipart: ใบสมัคร + สำเนาบัตร + สำเนาใบขับขี่ = 3 ไฟล์
upload_max_filesize = 10M
post_max_size       = 40M
max_file_uploads    = 5

; ห้ามเปิดเผยเวอร์ชัน PHP
expose_php = Off

; error ลง stderr เท่านั้น — ห้ามแสดงให้ผู้ใช้เห็น
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

date.timezone = Asia/Bangkok

; session ของ Staff Portal
session.cookie_httponly = On
session.cookie_secure   = On
session.cookie_samesite = Strict
session.use_strict_mode = On

; Argon2id สำหรับ PIN และรหัสผ่าน (architecture.md §5)
; ค่าจริงกำหนดในโค้ด Laravel — ตรงนี้เป็น floor
