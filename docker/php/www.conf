[www]
; 🔴 master รันเป็น root เพื่อ bind socket แล้ว drop เป็น www-data
;    worker ไม่เคยรันเป็น root — นี่คือเหตุผลที่ artisan ที่เขียน storage/
;    ต้องใช้ `-u www-data` (CLAUDE.md §5)
user  = www-data
group = www-data

listen = 0.0.0.0:9000
listen.backlog = 512

pm = dynamic
pm.max_children      = 20
pm.start_servers     = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests      = 500

; log ออก stderr ให้ docker เก็บ
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null

; health check ของ container
pm.status_path = /fpm-status
ping.path      = /fpm-ping
