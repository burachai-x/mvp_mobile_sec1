# gitleaks config — รันทั้ง pre-commit hook และ CI (CLAUDE.md §3)
title = "mvp_mobile_sec1"

[extend]
useDefault = true

# --- rule เฉพาะของโปรเจกต์นี้ ---

[[rules]]
id = "document-kek"
description = "DOCUMENT_KEK — กุญแจถอดสำเนาบัตรประชาชนทั้งฐาน (architecture.md §13)"
regex = '''(?i)DOCUMENT_KEK\s*[=:]\s*['"]?[A-Za-z0-9+/=]{32,}'''
tags = ["key", "critical"]

[[rules]]
id = "national-id-encryption-key"
description = "NATIONAL_ID_ENCRYPTION_KEY"
regex = '''(?i)NATIONAL_ID_ENCRYPTION_KEY\s*[=:]\s*['"]?[A-Za-z0-9+/=]{32,}'''
tags = ["key", "critical"]

[[rules]]
id = "device-uuid-pepper"
description = "DEVICE_UUID_PEPPER — เปลี่ยนไม่ได้หลัง production"
regex = '''(?i)DEVICE_UUID_PEPPER\s*[=:]\s*['"]?[A-Za-z0-9+/=]{16,}'''
tags = ["key"]

[[rules]]
id = "manifest-signing-key"
description = "MANIFEST_SIGNING_KEY — เซ็น manifest ปลอมได้ = ส่งมัลแวร์ลงทุกเครื่อง (ADR 0006)"
regex = '''(?i)MANIFEST_SIGNING_KEY\s*[=:]\s*['"]?\S{16,}'''
tags = ["key", "critical"]

[[rules]]
id = "garage-credentials"
description = "Garage S3 access/secret key"
regex = '''(?i)GARAGE_(ACCESS|SECRET)_KEY\s*[=:]\s*['"]?[A-Za-z0-9+/=]{16,}'''
tags = ["key"]

[[rules]]
id = "garage-rpc-secret"
description = "Garage rpc_secret ใน garage.toml"
regex = '''(?i)rpc_secret\s*=\s*['"][0-9a-f]{64}['"]'''
tags = ["key"]

[[rules]]
id = "thai-national-id"
description = "เลขบัตรประชาชนไทย 13 หลัก — ห้ามอยู่ใน seeder/fixture/test (CLAUDE.md §8)"
regex = '''(?i)(?:national_id|citizen_id|เลขบัตร)\D{0,10}\b([0-9]{13})\b'''
# ต้องชี้ secret ไปที่ตัวเลข ไม่ใช่กลุ่มแรกของ regex
# ถ้าไม่ตั้ง gitleaks จะถือว่า capture group 1 คือ secret แล้ว allowlist
# ที่เขียนจับตัวเลขจะไม่ match เลย (เสียเวลาหาสาเหตุอยู่พักหนึ่ง)
secretGroup = 1
tags = ["pii", "pdpa"]

[allowlist]
description = "ค่าตัวอย่างที่อนุญาต"
paths = [
  '''\.gitleaks\.toml$''',
  '''\.env\.example$''',
  '''^docs/''',
]
regexes = [
  '''CHANGE_ME''',
  '''replace-with-''',
  '''0{16,}''',

  # เลขบัตรสมมติที่เป็นไปไม่ได้ในทะเบียนจริง — เรียงต่อเนื่อง หรือเลขเดียวซ้ำ 13 ตัว
  #
  # ไม่ยกเว้นทั้งโฟลเดอร์ tests/ โดยตั้งใจ: ถ้ายกเว้นทั้งโฟลเดอร์
  # เลขบัตรจริงที่หลุดเข้า fixture จะผ่านไปเงียบๆ ซึ่งเป็นสิ่งที่กฎนี้มีไว้จับ
  # (CLAUDE.md §8 ห้ามใช้ข้อมูลจริงใน seeder / fixture / test)
  #
  # ทางที่ดีกว่าสำหรับ fixture ใหม่: ใช้เลขที่ checksum หลักที่ 13 ไม่ผ่าน
  # ซึ่งกรมการปกครองออกให้ไม่ได้เลย
  # gitleaks ใช้ Go RE2 ซึ่ง **ไม่รองรับ backreference** — เขียน (\d)\1{12}
  # แล้ว gitleaks จะ crash ทั้งตัว ไม่ใช่แค่ข้ามกฎ จึงต้องแจกแจงตรงๆ
  '''\b0123456789012\b''',
  '''\b1234567890123\b''',
  '''\b9876543210987\b''',
  '''\b0{13}\b''',
  '''\b1{13}\b''',
  '''\b9{13}\b''',
]
